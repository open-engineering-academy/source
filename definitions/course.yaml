apiVersion: open-engineering.io/v1alpha1
kind: Definition
metadata:
  name: course
  description: >
    OE Course artifact contract for academy course metadata (the projection
    of every courses/<slug>/metadata.yaml). Adapter-generated resources are
    validated against this Definition; see memo14.md.
spec:
  target:
    apiVersion: open-engineering.io/v1alpha1
    kind: Course
  schema:
    type: object
    additionalProperties: false
    required:
      - apiVersion
      - kind
      - metadata
      - spec
    properties:
      apiVersion:
        type: string
      kind:
        type: string
      metadata:
        type: object
        additionalProperties: false
        required:
          - name
          - id
        properties:
          name:
            type: string
            description: DNS-1123 projection of the academy id (dots replaced with dashes).
          id:
            type: string
            description: Original academy id (dot-shape) preserved for cross-course references.
          slug:
            type: string
      spec:
        type: object
        additionalProperties: true
        required:
          - title
          - level
          - duration
        properties:
          title:
            type: string
          level:
            type: string
            enum:
              - beginner
              - intermediate
              - advanced
          duration:
            type: string
          entry:
            type: string
          glossary:
            type: string
          sections:
            type: array
            items:
              type: string
          prerequisites:
            type: array
            items:
              type: string
          teaches:
            type: array
            items:
              type: string
          produces:
            type: array
            items:
              type: string
          references_labs:
            type: array
            items:
              type: string
          references_exercises:
            type: array
            items:
              type: string
          constructive_role:
            type: string
            enum:
              - definition
              - realization
              - explanation
          checkable_profile:
            type: string
          runtime_substrate:
            type: string
          runs_on:
            type: string
          constraints:
            type: array
            items:
              type: string
          feedback:
            type: array
