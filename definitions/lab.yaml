apiVersion: open-engineering.io/v1alpha1
kind: Definition
metadata:
  name: lab
  description: >
    OE Lab artifact contract for academy lab metadata (the projection of every
    labs/<slug>/metadata.yaml and every course-scoped lab metadata). Adapter-
    generated resources are validated against this Definition; see memo14.md.
spec:
  target:
    apiVersion: open-engineering.io/v1alpha1
    kind: Lab
  schema:
    type: object
    additionalProperties: false
    required:
      - apiVersion
      - kind
      - metadata
      - spec
    properties:
      apiVersion:
        type: string
      kind:
        type: string
      metadata:
        type: object
        additionalProperties: false
        required:
          - name
          - id
        properties:
          name:
            type: string
            description: DNS-1123 projection of the academy id (dots replaced with dashes).
          id:
            type: string
            description: Original academy id (dot-shape) preserved for cross-artifact references.
      spec:
        type: object
        additionalProperties: true
        required:
          - title
          - level
          - duration
        properties:
          title:
            type: string
          level:
            type: string
            enum:
              - beginner
              - intermediate
              - advanced
          duration:
            type: string
          prerequisites:
            type: array
            items:
              type: string
          teaches:
            type: array
            items:
              type: string
          produces:
            type: array
            items:
              type: string
          referenced_by:
            type: array
            items:
              type: string
          constructive_role:
            type: string
            enum:
              - definition
              - realization
              - explanation
          realizes:
            type: array
            items:
              type: string
          realization_pattern:
            type: string
          runtime_substrate:
            type: string
          runs_on:
            type: string
          interaction_topology:
            type: string
          transport_adapters:
            type: array
          control_surfaces:
            type: array
            items:
              type: string
          capabilities:
            type: array
            items:
              type: string
          hands_provider:
            type: string
          depends_on:
            type: array
            items:
              type: string
          composes:
            type: array
            items:
              type: string
          composition_pattern:
            type: string
          checkable_profile:
            type: string
          conformance_status:
            type: string
            enum:
              - conformant
              - non-conformant
              - not-evaluated
          validated_by:
            type: array
            items:
              type: string
          validation_results:
            type: array
          lifecycle_state:
            type: string
            enum:
              - proposed
              - operational
              - deprecated
              - retired
          evidence:
            type: array
          feedback:
            type: array
          learning:
            type: object
            additionalProperties: true
          visualization:
            type: object
            additionalProperties: true
