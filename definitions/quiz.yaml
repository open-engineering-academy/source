apiVersion: open-engineering.io/v1alpha1
kind: Definition
metadata:
  name: quiz
  description: >
    OE Quiz artifact contract, projected from quiz metadata.yaml files copied
    from templates/quiz/. Currently applies only to the template placeholder;
    see memo14.md.
spec:
  target:
    apiVersion: open-engineering.io/v1alpha1
    kind: Quiz
  schema:
    type: object
    additionalProperties: false
    required:
      - apiVersion
      - kind
      - metadata
      - spec
    properties:
      apiVersion:
        type: string
      kind:
        type: string
      metadata:
        type: object
        additionalProperties: false
        required:
          - name
          - id
        properties:
          name:
            type: string
            description: DNS-1123 projection of the academy id (dots replaced with dashes).
          id:
            type: string
      spec:
        type: object
        additionalProperties: true
        required:
          - title
          - scope
          - course
        properties:
          title:
            type: string
          scope:
            type: string
            enum:
              - course
              - lesson
          course:
            type: string
            description: Academy id of the owning course (dot-shape).
          lesson:
            description: Academy id of the owning lesson, or null when scope is course.
          question_count:
            type: integer
          teaches:
            type: array
            items:
              type: string
