# Crossplane Function used by the Composition.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.9.0
---
# Crossplane Provider that lets the control plane reconcile Kubernetes
# resources (ConfigMaps, Jobs, Deployments, ...) via the same declarative API.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:v0.18.0
  runtimeConfigRef:
    apiVersion: pkg.crossplane.io/v1beta1
    kind: DeploymentRuntimeConfig
    name: provider-kubernetes-drc
---
# Pin the provider Deployment's ServiceAccount to a stable, well-known name
# so the RBAC binding in 02-rbac.yaml stays valid on any cluster.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes-drc
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
