name: Build and Publish Academy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Render academy site and publish to pages branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Show Quarto version
        run: quarto --version

      - name: Render root academy site
        run: quarto render

      - name: Render pico course website
        run: quarto render courses/pico

      - name: Render crossplane course website
        run: quarto render courses/crossplane

      - name: Verify root render output
        run: |
          test -f docs/index.html || {
            echo "::error::Missing docs/index.html — root site render did not produce expected output"
            exit 1
          }

      - name: Verify pico render output
        run: |
          test -f courses/pico/_site/index.html || {
            echo "::error::Missing courses/pico/_site/index.html — pico render did not produce expected output"
            exit 1
          }

      - name: Verify crossplane render output
        run: |
          test -f courses/crossplane/_site/index.html || {
            echo "::error::Missing courses/crossplane/_site/index.html — crossplane render did not produce expected output"
            exit 1
          }

      - name: Assemble combined site
        run: |
          mkdir -p docs/courses/pico
          cp -R courses/pico/_site/. docs/courses/pico/
          mkdir -p docs/courses/crossplane
          cp -R courses/crossplane/_site/. docs/courses/crossplane/

      # The `pages` branch is the artifact consumed by a git-pages server
      # (https://codeberg.org/git-pages/git-pages). A git-pages server pulls
      # `refs/heads/pages` from this repository on trigger (PUT of the repo
      # URL, or POST of a webhook payload). Server endpoint, authorization
      # (DNS challenge or allowlist, or forge token), and clone credentials
      # for this private repo are external inputs configured out-of-band.
      - name: Publish assembled site to pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -R docs/. "${publish_dir}/"
          cd "${publish_dir}"
          git init -q -b pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c commit.gpgsign=false commit -q -m "Publish site from ${GITHUB_SHA}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force -q "${remote}" pages

      # Notify the git-pages server to pull the freshly-pushed `pages` branch.
      # Uses the DNS-challenge auth model (Authorization: Pages <token>) and
      # sends the private-repo clone URL as an application/x-www-form-urlencoded
      # body per the git-pages README (PUT semantics). Skips with a notice
      # when any of the three secrets is missing so the workflow keeps
      # passing before the external DNS/hosting inputs land.
      - name: Notify git-pages server (PUT trigger)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PAGES_SITE_URL: ${{ secrets.PAGES_SITE_URL }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          GH_PAGES_CLONE_TOKEN: ${{ secrets.GH_PAGES_CLONE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PAGES_SITE_URL:-}" ] || [ -z "${PAGES_TOKEN:-}" ] || [ -z "${GH_PAGES_CLONE_TOKEN:-}" ]; then
            echo "::notice title=git-pages trigger skipped::One or more of PAGES_SITE_URL, PAGES_TOKEN, GH_PAGES_CLONE_TOKEN is not set. Skipping PUT."
            exit 0
          fi
          clone_url="https://x-access-token:${GH_PAGES_CLONE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          http_status="$(curl -sS -o /tmp/pages-response.txt -w '%{http_code}' \
            -X PUT "${PAGES_SITE_URL}" \
            -H "Authorization: Pages ${PAGES_TOKEN}" \
            --data-urlencode "${clone_url}")"
          if [ "${http_status}" -ge 200 ] && [ "${http_status}" -lt 300 ]; then
            echo "git-pages PUT succeeded (HTTP ${http_status})."
            cat /tmp/pages-response.txt
          else
            echo "::error title=git-pages PUT failed::HTTP ${http_status}"
            cat /tmp/pages-response.txt
            exit 1
          fi
