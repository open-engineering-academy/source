[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "open-engineering-kernel"
version = "0.1.0"
description = "Mini Open Engineering Kernel — Identifier, Manifest, and Rule semantics in Rust"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Engineering Academy" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
]

[tool.maturin]
features = ["pyo3/extension-module"]
# Native extension lives as open_engineering_kernel.open_engineering_kernel (.so)
# Python package sources in python/ provide __init__.py that re-exports public API.
python-source = "python"
module-name = "open_engineering_kernel.open_engineering_kernel"
