teaches:
  - Cyber-physical Open Engineering
  - Digital twins through Pico
  - Capability-oriented engineering
  - Semantic interfaces over hardware interfaces
  - Desired vs observed state
  - Crossplane composition of an actuator
  - Pico runtime on Manifold
  - Event-driven actuation
  - Edge adapters and device protocols
  - Open Engineering events and messaging
  - Home Assistant as control surface
  - Observability and correlation
  - Safe physical actuation
  - Simulation before physics
produces:
  - pixstars-head-pitch (digital twin)
  - pixstars-head-actuator (actuator capability)
  - simulated-actuator reference
  - edge-adapter (ESP32) reference
  - nod gesture
references_labs:
  - oe.lab.hello-pico-on-kubernetes
