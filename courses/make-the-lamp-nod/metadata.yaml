id: oe.course.make-the-lamp-nod
slug: make-the-lamp-nod
title: "Make the Lamp Nod — From Digital Twin to Physical Actuation with Open Engineering"
level: advanced
duration: 16h
entry: index.qmd
glossary: glossary.qmd
sections:
  - modules
  - architecture
prerequisites:
  - oe.course.kubernetes
  - oe.course.crossplane
  - oe.course.pico
  - oe.course.manifold
