references_exercises: []
constructive_role: definition
constraints:
  - "A valid nod is requested as a semantic capability (nod), not as raw actuator register writes."
  - "The Pico digital twin maintains both desired and observed state."
  - "The simulated actuator and the physical AX-12A implement the same logical actuator contract."
  - "The ESP32 edge adapter understands actuator-level commands but not character semantics."
  - "Physical movement operates only inside explicitly configured safe limits after calibration."
  - "The course is completable end-to-end in simulation without hardware."
