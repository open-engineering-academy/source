feedback:
  - observation: "Framing Manifold as the RuntimeEnvironment and Wrangler as the InteractionTopology authoring surface keeps compose/construct/behave visible: Crossplane still composes onto Kubernetes, Sandcastle still constructs Pico Elements, and Manifold only owns lifecycle and notification for the running Pico."
